name: Accessibility & Performance CI

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'reference.html'
      - 'tokens.css'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - 'reference.html'
      - 'tokens.css'

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start static server
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:8080/examples/account.html
            http://localhost:8080/examples/wallet.html
            http://localhost:8080/reference.html
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json

  axe:
    name: Axe Accessibility Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start static server
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Run axe-core
        uses: dequelabs/axe-api-action@v1
        with:
          url: http://localhost:8080/examples/account.html
          # Fail on serious/critical violations
          tags: wcag2a,wcag2aa,wcag21a,wcag21aa
