name: Accessibility & Performance CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse-desktop:
    name: Lighthouse Audit (Desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start static server
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Run Lighthouse CI (desktop)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/examples/account.html
            http://localhost:8080/examples/wallet.html
            http://localhost:8080/reference.html
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json

  lighthouse-mobile:
    name: Lighthouse Audit (Mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start static server
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Run Lighthouse CI (mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/examples/wallet.html
            http://localhost:8080/examples/account.html
            http://localhost:8080/reference.html
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc-mobile.json

  quality:
    name: Tokens, HTML, Contrast, Links & Axe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Token single-source check
        run: npm run tokens:check

      - name: HTML structure validation
        run: npm run validate:html

      - name: Token contrast checks
        run: npm run test:contrast

      - name: Local link checks
        run: npm run test:links

      - name: Axe scan (all six pages, zero violations)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:a11y
