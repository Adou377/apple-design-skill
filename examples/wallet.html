<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet — App screen test (current skill)</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Design tokens loaded via ../tokens.css (includes dark mode + motion curves) */

/* Dark-mode adjustments — reuse tokens.css dark-mode custom properties */
@media (prefers-color-scheme: dark) {
  body{background:var(--bg);}
  .navc{background:var(--glass-bg-regular-dark);}
  .tabbar{background:var(--glass-bg-regular-dark);}
  .glass-chip{background:var(--glass-bg-clear-dark);border:var(--glass-edge-dark);}
  .homebar{background:rgba(255,255,255,0.85);}
  .tx .ic{background:var(--hover);}
  .sheet{background:var(--glass-bg-surface-dark);}
  .sheet .opt .ic{background:var(--hover);}
}

/* Reduced-motion support */
@media (prefers-reduced-motion: reduce) {
  .navc,.scrim,.sheet{transition:opacity 200ms ease,transform 200ms ease !important;}
}

/* Reduced-transparency support */
@media (prefers-reduced-transparency: reduce) {
  .navc,.tabbar{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;}
  .sheet{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none;}
  .glass-chip{background:rgba(255,255,255,0.3);backdrop-filter:none;-webkit-backdrop-filter:none;}
}

*{margin:0;padding:0;box-sizing:border-box;}
html{font-optical-sizing:auto;}
body{background:#c9ccd2;font-family:var(--font);-webkit-font-smoothing:antialiased;
  min-height:100vh;display:grid;place-items:center;padding:40px;}

/* Focus-visible — one opaque ring (WCAG 1.4.11) */
:where(button,a,input,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ── device frame — exact spec from app.md §1 (never hand-roll) ── */
.device{position:relative;width:393px;height:852px;background:#000;border-radius:55px;
  padding:12px;box-shadow:0 50px 100px rgba(0,0,0,0.5);}
.screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:44px;overflow:hidden;
  display:flex;flex-direction:column;}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;
  background:#000;border-radius:999px;z-index:var(--z-sidebar);}

/* Small viewports: drop the decorative phone frame instead of overflowing */
@media (max-width:432px){
  body{padding:0;display:block;}
  .device{width:100%;max-width:393px;height:100vh;margin:0 auto;padding:0;border-radius:0;box-shadow:none;}
  .screen{border-radius:0;}
  .island{display:none;}
  .toast{max-width:calc(100vw - 32px);white-space:normal;text-align:center;}
}
.statusbar{height:59px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;font-size:15px;font-weight:600;color:var(--text);z-index:var(--z-sticky);}
.statusbar .r{display:flex;gap:5px;align-items:center;font-size:13px;}

/* compact large-title bar (shows on scroll) */
.navc{position:absolute;top:59px;left:0;right:0;height:44px;z-index:var(--z-sticky);display:flex;align-items:center;justify-content:center;
  background:var(--glass-bg-regular-light);backdrop-filter:saturate(var(--glass-sat-rest)) blur(var(--glass-blur-rest));-webkit-backdrop-filter:saturate(var(--glass-sat-rest)) blur(var(--glass-blur-rest));
  border-bottom:1px solid transparent;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease-out-quart),backdrop-filter .3s var(--ease-out-quart),-webkit-backdrop-filter .3s var(--ease-out-quart),box-shadow .3s var(--ease-out-quart),border-color .3s var(--ease-out-quart);}
.navc.show{opacity:1;border-bottom-color:var(--hairline);box-shadow:var(--glass-shadow-scrolled);
  backdrop-filter:saturate(var(--glass-sat-scrolled)) blur(var(--glass-blur-scrolled));-webkit-backdrop-filter:saturate(var(--glass-sat-scrolled)) blur(var(--glass-blur-scrolled));}
.navc span{font-size:16px;font-weight:600;letter-spacing:-0.01em;}

.scroll{flex:1;overflow-y:auto;}
.lt{padding:6px 20px 8px;}
.lt h1{font-size:34px;font-weight:700;letter-spacing:-0.02em;}
.content{padding:16px 16px 24px;display:flex;flex-direction:column;gap:22px;}

.balance{position:relative;overflow:hidden;border-radius:var(--r-hero);padding:22px;
  background:var(--grad-cta);box-shadow:var(--sh-cta);}
.balance .orb{position:absolute;border-radius:50%;}
.balance .o1{width:200px;height:200px;background:rgba(255,255,255,0.18);filter:blur(46px);top:-70px;right:-30px;}
.balance .o2{width:160px;height:160px;background:rgba(120,80,255,0.5);filter:blur(50px);bottom:-70px;left:10%;}
.balance-in{position:relative;}
.balance .lbl{font-size:13px;color:rgba(255,255,255,0.8);font-weight:550;}
.balance .amt{margin-top:6px;font-size:38px;font-weight:700;color:#fff;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
.balance .row{display:flex;gap:10px;margin-top:18px;}
.glass-chip{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:var(--r-pill);
  background:var(--glass-bg-clear-light);border:var(--glass-edge-light);
  backdrop-filter:blur(var(--glass-clear-blur));-webkit-backdrop-filter:blur(var(--glass-clear-blur));color:#fff;font-size:14px;font-weight:600;text-decoration:none;}

.sec-label{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:0.04em;
  text-transform:uppercase;margin:0 6px 10px;}
.panel{background:var(--surface);border-radius:var(--r-panel);box-shadow:var(--sh-panel);overflow:hidden;}
.tx{display:flex;align-items:center;gap:13px;padding:13px 16px;min-height:60px;}
.tx+.tx{border-top:1px solid var(--hairline);}
.tx .ic{width:38px;height:38px;border-radius:50%;background:var(--track);flex:none;
  display:grid;place-items:center;font-size:16px;color:var(--text-2);}
.tx .m{flex:1;min-width:0;}
.tx .m .t{font-size:15px;color:var(--text);font-weight:500;}
.tx .m .s{font-size:12.5px;color:var(--text-2);margin-top:1px;}
.tx .a{font-size:15px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}

.tabbar{flex:none;height:83px;padding:8px 0 34px;
  background:var(--glass-bg-regular-light);backdrop-filter:saturate(var(--glass-sat-rest)) blur(var(--glass-blur-rest));-webkit-backdrop-filter:saturate(var(--glass-sat-rest)) blur(var(--glass-blur-rest));
  border-top:1px solid var(--hairline);display:flex;justify-content:space-around;align-items:flex-start;
  transition:backdrop-filter .3s var(--ease-out-quart),-webkit-backdrop-filter .3s var(--ease-out-quart),box-shadow .3s var(--ease-out-quart),border-color .3s var(--ease-out-quart);}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;min-height:44px;
  font:inherit;font-size:10px;color:var(--text-2);width:64px;padding:2px 0 0;border:none;background:none;cursor:pointer;}
.tab.on{color:var(--accent-link);}
.tab .ic{color:currentColor;}   /* line icon inherits tab color: grey inactive, accent active */
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;
  border-radius:999px;background:rgba(0,0,0,0.85);z-index:var(--z-system);}

.scrim{position:absolute;inset:0;background:var(--glass-dim);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:var(--z-scrim);}
.scrim.open{opacity:1;pointer-events:auto;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--glass-bg-surface-light);
  backdrop-filter:saturate(var(--glass-sat-rest)) blur(var(--glass-blur-rest));-webkit-backdrop-filter:saturate(var(--glass-sat-rest)) blur(var(--glass-blur-rest));
  border-radius:22px 22px 0 0;padding:10px 20px 34px;z-index:var(--z-modal);
  transform:translateY(100%);transition:transform .4s var(--ease-spring),backdrop-filter .3s var(--ease-out-quart),-webkit-backdrop-filter .3s var(--ease-out-quart),box-shadow .3s var(--ease-out-quart);}
.sheet.open{transform:translateY(0);}
.grab{width:38px;height:5px;border-radius:999px;background:var(--faint);margin:0 auto 16px;}
.sheet h3{font-size:20px;font-weight:700;letter-spacing:-0.02em;margin-bottom:6px;}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:14px 0;
  border:none;border-bottom:1px solid var(--hairline);background:none;font:inherit;font-size:16px;color:var(--text);text-align:left;cursor:pointer;}
.sheet .cancel{display:flex;align-items:center;justify-content:center;width:100%;min-height:44px;margin-top:12px;
  border:none;border-radius:var(--r-sheet);background:var(--btn-quiet-bg);color:var(--text);font:600 15px var(--font);cursor:pointer;}
.toast{position:absolute;left:50%;bottom:100px;transform:translateX(-50%) translateY(8px);z-index:var(--z-toast);
  padding:10px 16px;border-radius:var(--r-pill);background:var(--surface);box-shadow:var(--sh-card);
  font:600 13px var(--font);color:var(--text);opacity:0;pointer-events:none;
  transition:opacity .26s var(--ease-spring),transform .26s var(--ease-spring);white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.sheet .opt .ic{width:34px;height:34px;border-radius:9px;background:var(--track);flex:none;
  display:grid;place-items:center;color:var(--text-2);}
</style>
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="island"></div>
    <div class="statusbar"><span>9:41</span><span class="r">5G&nbsp;&nbsp;&#9646;&#9646;&#9646;</span></div>

    <div class="navc" id="navc"><span>钱包</span></div>
    <div class="scroll" id="scroll">
      <div class="lt"><h1>钱包</h1></div>
      <div class="content">
        <div class="balance">
          <div class="orb o1"></div><div class="orb o2"></div>
          <div class="balance-in">
            <div class="lbl">可用余额</div>
            <div class="amt">¥12,480.00</div>
            <div class="row">
              <button class="glass-chip" type="button">转账</button>
              <button class="glass-chip" type="button">收款</button>
            </div>
          </div>
        </div>
        <div>
          <div class="sec-label">最近交易</div>
          <div class="panel">
            <div class="tx"><div class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></div><div class="m"><div class="t">超市购物</div><div class="s">今天 14:32 · 招商银行</div></div><div class="a">-¥86.50</div></div>
            <div class="tx"><div class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div><div class="m"><div class="t">工资入账</div><div class="s">昨天 09:00 · 公司</div></div><div class="a">+¥18,600.00</div></div>
            <div class="tx"><div class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg></div><div class="m"><div class="t">星巴克</div><div class="s">昨天 08:15 · 支付宝</div></div><div class="a">-¥38.00</div></div>
            <div class="tx"><div class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg></div><div class="m"><div class="t">流媒体订阅</div><div class="s">6月10日 · 自动扣款</div></div><div class="a">-¥28.00</div></div>
          </div>
        </div>
      </div>
    </div>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab on" type="button" aria-current="page" data-nav><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="17" cy="14.5" r="1.25"/></svg>钱包</button>
      <button class="tab" type="button" data-nav><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>卡片</button>
      <button class="tab" type="button" id="addBtn" aria-haspopup="dialog" aria-controls="sheet"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>添加</button>
      <button class="tab" type="button" data-nav><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>我的</button>
    </nav>
    <div class="homebar"></div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" inert>
      <div class="grab"></div>
      <h3 id="sheetTitle">添加</h3>
      <button class="opt" type="button" data-opt="添加银行卡"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg></span>添加银行卡</button>
      <button class="opt" type="button" data-opt="发起转账"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17l-4-4 4-4"/><path d="M3 13h14"/><path d="M17 7l4 4-4 4"/></svg></span>发起转账</button>
      <button class="opt" type="button" data-opt="扫码收款"><span class="ic"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3z"/><path d="M17 17v4M21 17v4M14 21h3M21 21h0"/></svg></span>扫码收款</button>
      <button class="cancel" type="button" id="sheetCancel">取消</button>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>
<script>
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet');
const sc=document.getElementById('scroll'),nc=document.getElementById('navc');let scrollTicking=false;sc.addEventListener('scroll',()=>{if(!scrollTicking){scrollTicking=true;requestAnimationFrame(()=>{nc.classList.toggle('show',sc.scrollTop>44);scrollTicking=false;});}},{passive:true});

// Sheet focus management (aligned with account.html)
let lastFocused=null;
function sheetFocusables(){
  return [...sheet.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')];
}

function openSheet(){
  lastFocused=document.activeElement;
  sheet.inert=false;
  sheet.setAttribute('aria-hidden','false');
  scrim.classList.add('open');sheet.classList.add('open');
  setTimeout(()=>{const f=sheetFocusables();if(f[0])f[0].focus();},50);
}
function closeSheet(){
  scrim.classList.remove('open');sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden','true');
  // inert (not hidden) so the exit transition still plays.
  sheet.inert=true;
  if(lastFocused)lastFocused.focus();
}

const addBtn=document.getElementById('addBtn');
addBtn.addEventListener('click',openSheet);
document.getElementById('sheetCancel').addEventListener('click',closeSheet);
scrim.addEventListener('click',closeSheet);

// Focus trap: Tab / Shift+Tab stays inside the sheet
sheet.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return;
  const f=sheetFocusables();if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey){if(document.activeElement===first){e.preventDefault();last.focus();}}
  else{if(document.activeElement===last){e.preventDefault();first.focus();}}
});
// Escape to close
addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('open'))closeSheet();});

// Sheet options: pick → close + announce via role=status
const toast=document.getElementById('toast');
let toastTimer=null;
sheet.querySelectorAll('.opt').forEach(opt=>{
  opt.addEventListener('click',()=>{
    const label=opt.getAttribute('data-opt');
    closeSheet();
    toast.textContent=label+'：已选择';
    toast.classList.add('show');
    if(toastTimer)clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
  });
});

// Nav tabs: native buttons + aria-current (no role=tab, no aria-controls)
const navTabs=[...document.querySelectorAll('.tabbar [data-nav]')];
navTabs.forEach(tab=>{
  tab.addEventListener('click',()=>{
    navTabs.forEach(t=>{t.classList.remove('on');t.removeAttribute('aria-current');});
    tab.classList.add('on');
    tab.setAttribute('aria-current','page');
  });
});
</script>
</body>
</html>
