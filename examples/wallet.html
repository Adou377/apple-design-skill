<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet — App screen test (current skill)</title>
<link rel="stylesheet" href="../tokens.css">
<style>
/* Design tokens loaded via ../tokens.css (includes dark mode + motion curves) */

/* Dark-mode adjustments for hardcoded values */
@media (prefers-color-scheme: dark) {
  body{background:#1c1c1e;}
  .navc{background:rgba(28,28,30,0.72);}
  .tabbar{background:rgba(28,28,30,0.82);}
  .homebar{background:rgba(255,255,255,0.85);}
  .tx .ic{background:#3a3a3c;}
  .sheet .opt .ic{background:#3a3a3c;}
}

/* Reduced-motion support */
@media (prefers-reduced-motion: reduce) {
  .navc,.scrim,.sheet{transition:opacity 200ms ease,transform 200ms ease !important;}
}

/* Reduced-transparency support */
@media (prefers-reduced-transparency: reduce) {
  .navc,.tabbar{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;}
  .glass-chip{background:rgba(255,255,255,0.3);backdrop-filter:none;-webkit-backdrop-filter:none;}
}

*{margin:0;padding:0;box-sizing:border-box;}
html{font-optical-sizing:auto;}
body{background:#c9ccd2;font-family:var(--font);-webkit-font-smoothing:antialiased;
  min-height:100vh;display:grid;place-items:center;padding:40px;}

/* ── device frame — exact spec from app.md §1 (never hand-roll) ── */
.device{position:relative;width:393px;height:852px;background:#000;border-radius:55px;
  padding:12px;box-shadow:0 50px 100px rgba(0,0,0,0.5);}
.screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:44px;overflow:hidden;
  display:flex;flex-direction:column;}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;
  background:#000;border-radius:999px;z-index:60;}
.statusbar{height:59px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;font-size:15px;font-weight:600;color:var(--text);z-index:55;}
.statusbar .r{display:flex;gap:5px;align-items:center;font-size:13px;}

/* compact large-title bar (shows on scroll) */
.navc{position:absolute;top:59px;left:0;right:0;height:44px;z-index:50;display:flex;align-items:center;justify-content:center;
  background:rgba(245,245,247,0.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent;opacity:0;pointer-events:none;transition:opacity .25s,border-color .25s;}
.navc.show{opacity:1;border-bottom-color:var(--hairline);}
.navc span{font-size:16px;font-weight:600;letter-spacing:-0.01em;}

.scroll{flex:1;overflow-y:auto;}
.lt{padding:6px 20px 8px;}
.lt h1{font-size:34px;font-weight:700;letter-spacing:-0.02em;}
.content{padding:16px 16px 24px;display:flex;flex-direction:column;gap:22px;}

.balance{position:relative;overflow:hidden;border-radius:var(--r-hero);padding:22px;
  background:var(--grad-cta);box-shadow:var(--sh-cta);}
.balance .orb{position:absolute;border-radius:50%;}
.balance .o1{width:200px;height:200px;background:rgba(255,255,255,0.18);filter:blur(46px);top:-70px;right:-30px;}
.balance .o2{width:160px;height:160px;background:rgba(120,80,255,0.5);filter:blur(50px);bottom:-70px;left:10%;}
.balance-in{position:relative;}
.balance .lbl{font-size:13px;color:rgba(255,255,255,0.8);font-weight:550;}
.balance .amt{margin-top:6px;font-size:38px;font-weight:700;color:#fff;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;}
.balance .row{display:flex;gap:10px;margin-top:18px;}
.glass-chip{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:var(--r-pill);
  background:rgba(255,255,255,0.16);border:1px solid rgba(255,255,255,0.22);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font-size:14px;font-weight:600;text-decoration:none;}

.sec-label{font-size:13px;font-weight:600;color:var(--text-3);letter-spacing:0.04em;
  text-transform:uppercase;margin:0 6px 10px;}
.panel{background:var(--surface);border-radius:var(--r-panel);box-shadow:var(--sh-panel);overflow:hidden;}
.tx{display:flex;align-items:center;gap:13px;padding:13px 16px;min-height:60px;}
.tx+.tx{border-top:1px solid var(--hairline);}
.tx .ic{width:38px;height:38px;border-radius:50%;background:#eef0f3;flex:none;
  display:grid;place-items:center;font-size:16px;color:var(--text-2);}
.tx .m{flex:1;min-width:0;}
.tx .m .t{font-size:15px;color:var(--text);font-weight:500;}
.tx .m .s{font-size:12.5px;color:var(--text-3);margin-top:1px;}
.tx .a{font-size:15px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}

.tabbar{flex:none;height:83px;padding:8px 0 22px;
  background:rgba(245,245,247,0.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--hairline);display:flex;justify-content:space-around;align-items:flex-start;}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--text-3);width:64px;padding-top:2px;}
.tab.on{color:var(--accent);}
.tab .ic{color:currentColor;}   /* line icon inherits tab color: grey inactive, accent active */
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;
  border-radius:999px;background:rgba(0,0,0,0.85);z-index:80;}

.scrim{position:absolute;inset:0;background:rgba(0,0,0,0.28);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:70;}
.scrim.open{opacity:1;pointer-events:auto;}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);
  border-radius:22px 22px 0 0;padding:10px 20px 34px;z-index:71;
  transform:translateY(100%);transition:transform .4s cubic-bezier(0.32,0.72,0,1);}
.sheet.open{transform:translateY(0);}
.grab{width:38px;height:5px;border-radius:999px;background:var(--faint);margin:0 auto 16px;}
.sheet h3{font-size:20px;font-weight:700;letter-spacing:-0.02em;margin-bottom:6px;}
.sheet .opt{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hairline);font-size:16px;color:var(--text);}
.sheet .opt .ic{width:34px;height:34px;border-radius:9px;background:#eef0f3;flex:none;}
</style>
</head>
<body>
<div class="device">
  <div class="screen">
    <div class="island"></div>
    <div class="statusbar"><span>9:41</span><span class="r">5G&nbsp;&nbsp;&#9646;&#9646;&#9646;</span></div>

    <div class="navc" id="navc"><span>钱包</span></div>
    <div class="scroll" id="scroll">
      <div class="lt"><h1>钱包</h1></div>
      <div class="content">
        <div class="balance">
          <div class="orb o1"></div><div class="orb o2"></div>
          <div class="balance-in">
            <div class="lbl">可用余额</div>
            <div class="amt">¥12,480.00</div>
            <div class="row">
              <button class="glass-chip" type="button">转账</button>
              <button class="glass-chip" type="button">收款</button>
            </div>
          </div>
        </div>
        <div>
          <div class="sec-label">最近交易</div>
          <div class="panel">
            <div class="tx"><div class="ic">超</div><div class="m"><div class="t">超市购物</div><div class="s">今天 14:32 · 招商银行</div></div><div class="a">-¥86.50</div></div>
            <div class="tx"><div class="ic">薪</div><div class="m"><div class="t">工资入账</div><div class="s">昨天 09:00 · 公司</div></div><div class="a">+¥18,600.00</div></div>
            <div class="tx"><div class="ic">咖</div><div class="m"><div class="t">星巴克</div><div class="s">昨天 08:15 · 支付宝</div></div><div class="a">-¥38.00</div></div>
            <div class="tx"><div class="ic">订</div><div class="m"><div class="t">流媒体订阅</div><div class="s">6月10日 · 自动扣款</div></div><div class="a">-¥28.00</div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tabbar" role="tablist" aria-label="主导航">
      <div class="tab on" role="tab" aria-selected="true" tabindex="0"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="17" cy="14.5" r="1.25"/></svg>钱包</div>
      <div class="tab" role="tab" aria-selected="false" tabindex="0"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg>卡片</div>
      <div class="tab" role="button" tabindex="0" id="addTab" aria-haspopup="dialog"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>添加</div>
      <div class="tab" role="tab" aria-selected="false" tabindex="0"><svg class="ic" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>我的</div>
    </div>
    <div class="homebar"></div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
      <div class="grab"></div>
      <h3 id="sheetTitle">添加</h3>
      <div class="opt" role="button" tabindex="0"><div class="ic"></div>添加银行卡</div>
      <div class="opt" role="button" tabindex="0"><div class="ic"></div>发起转账</div>
      <div class="opt" role="button" tabindex="0"><div class="ic"></div>扫码收款</div>
    </div>
  </div>
</div>
<script>
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet');
const sc=document.getElementById('scroll'),nc=document.getElementById('navc');sc.addEventListener('scroll',()=>nc.classList.toggle('show',sc.scrollTop>44),{passive:true});

// Sheet focus management (aligned with account.html)
const sheetFocusables=[...sheet.querySelectorAll('[role="button"][tabindex="0"]')];
let lastFocused=null;

function openSheet(){
  lastFocused=document.activeElement;
  scrim.classList.add('open');sheet.classList.add('open');
  sheet.setAttribute('aria-hidden','false');
  setTimeout(()=>sheetFocusables[0]&&sheetFocusables[0].focus(),50);
}
function closeSheet(){
  scrim.classList.remove('open');sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden','true');
  if(lastFocused)lastFocused.focus();
}

const addTab=document.getElementById('addTab');
addTab.addEventListener('click',openSheet);
addTab.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();openSheet();}
});
scrim.addEventListener('click',closeSheet);

// Focus trap: Tab / Shift+Tab stays inside the sheet
sheet.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return;
  var first=sheetFocusables[0],last=sheetFocusables[sheetFocusables.length-1];
  if(e.shiftKey){if(document.activeElement===first){e.preventDefault();last.focus();}}
  else{if(document.activeElement===last){e.preventDefault();first.focus();}}
});
// Escape to close
addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('open'))closeSheet();});

// Sheet options: Enter/Space to activate
sheet.querySelectorAll('.opt').forEach(opt=>{
  opt.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();opt.click();}
  });
});

// Tabbar keyboard navigation
const tabs=[...document.querySelectorAll('.tabbar [role="tab"]')];
tabs.forEach(tab=>{
  tab.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();tab.click();}
  });
  tab.addEventListener('click',()=>{
    tabs.forEach(t=>{t.classList.remove('on');t.setAttribute('aria-selected','false');});
    tab.classList.add('on');tab.setAttribute('aria-selected','true');
  });
});
</script>
</body>
</html>
